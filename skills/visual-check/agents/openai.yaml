interface:
  display_name: "Visual Check"
  short_description: "Verify produced visuals before completion"
  default_prompt: "Use $visual-check conditionally: for visual output completion, inspect the exact artifact and version before any acceptance or readiness claim; for approved-reference translation, verify one representative for each materially different output kind or target form in its native target form and minimum actual-use context before fan-out, and when objective or subjective verification remains unresolved pause fan-out; for a concrete defect, identify retries by causal mechanism plus expected observation and change artifacts only with fix authority."
policy:
  allow_implicit_invocation: true
