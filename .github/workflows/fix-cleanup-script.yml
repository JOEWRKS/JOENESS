name: Fix cleanup installer separator

'on':
  push:
    branches:
      - codex/joeness-current-main-cleanup

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch known separator construction defect and self-remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/sync-harness.ps1'
          $text = [IO.File]::ReadAllText($path)
          $old = '$separator = $script:Utf8NoBom.GetBytes(($Newline * $SeparatorCount))'
          $new = @'
          $separatorText = ''
          for ($i = 0; $i -lt $SeparatorCount; $i++) { $separatorText += $Newline }
          $separator = $script:Utf8NoBom.GetBytes($separatorText)
          '@.Trim()
          if (-not $text.Contains($old)) { throw 'Expected separator anchor not found.' }
          $updated = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $updated, (New-Object Text.UTF8Encoding($false)))
          git rm -- .github/workflows/fix-cleanup-script.yml
          git config user.name 'JOEWRKS'
          git config user.email 'actions@users.noreply.github.com'
          git add -- scripts/sync-harness.ps1
          git diff --check --cached
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git commit -m 'fix: build managed suffix separator deterministically'
          if ($LASTEXITCODE -ne 0) { throw 'fix commit failed' }
          git push origin HEAD:codex/joeness-current-main-cleanup
          if ($LASTEXITCODE -ne 0) { throw 'fix push failed' }
