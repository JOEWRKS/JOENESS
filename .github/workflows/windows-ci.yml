name: Windows deterministic release gate

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for deterministic repository tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.3.0
          package-manager-cache: false

      - name: Set up Python for deterministic vendor tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.5

      - name: Verify CI toolchain versions
        shell: pwsh
        run: |
          $nodeVersion = (& node --version).Trim()
          if ($nodeVersion -ne 'v26.3.0') {
            throw "Expected Node.js v26.3.0, found $nodeVersion"
          }
          $pythonVersion = (& python --version 2>&1).Trim()
          if ($pythonVersion -ne 'Python 3.14.5') {
            throw "Expected Python 3.14.5, found $pythonVersion"
          }

      - name: Validate Node test taxonomy coverage
        shell: pwsh
        run: node .\scripts\run-node-test-group.mjs --check

      - name: Run current release Node tests
        shell: pwsh
        run: node .\scripts\run-node-test-group.mjs current-release

      - name: Run historical integrity Node tests
        shell: pwsh
        run: node .\scripts\run-node-test-group.mjs historical-integrity

      - name: Run sync harness deterministic tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\sync-harness.tests.ps1

      - name: Run project setup deterministic tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\project-setup.tests.ps1

      - name: Run P0 evaluation contract deterministic tests
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\p0-evaluation-contract.tests.ps1

      - name: Run vendor Python unit tests
        shell: pwsh
        run: python -B -m unittest discover -s .\vendor\ui-ux-pro-max\scripts\tests -p 'test_*.py'

      - name: Check candidate diff whitespace
        shell: pwsh
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $zeroSha = '0000000000000000000000000000000000000000'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseSha = $env:PULL_REQUEST_BASE_SHA
          } elseif (
            $env:PUSH_BEFORE_SHA -and
            $env:PUSH_BEFORE_SHA -ne $zeroSha
          ) {
            $baseSha = $env:PUSH_BEFORE_SHA
          } else {
            $baseSha = (& git rev-parse "$env:GITHUB_SHA^").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to resolve the fallback parent commit.'
            }
          }

          & git cat-file -e "$baseSha^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate diff base commit is unavailable: $baseSha"
          }
          & git merge-base $baseSha $env:GITHUB_SHA | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate diff has no merge base: $baseSha...$env:GITHUB_SHA"
          }
          & git diff --check "${baseSha}...$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
