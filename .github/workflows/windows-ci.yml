name: Windows current release gate

'on':
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  current-release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify full history checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isShallow = (& git rev-parse --is-shallow-repository).Trim()
          if ($LASTEXITCODE -ne 0 -or $isShallow -ne 'false') {
            throw 'JOENESS release gate requires full Git history.'
          }

      - name: Run current JOENESS release contract
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\joeness-release.tests.ps1

      - name: Verify setup safety and package contracts
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tests\joeness-project-setup.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\joeness-project-setup.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\joeness-install.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File .\tests\joeness-install.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/joeness-setup-contract.tests.mjs tests/joeness-setup-fixtures.tests.mjs tests/joeness-review-gate.tests.mjs
          exit $LASTEXITCODE

      - name: Check candidate diff whitespace
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zeroSha = '0000000000000000000000000000000000000000'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseSha = $env:PR_BASE_SHA
          } elseif ($env:PUSH_BEFORE_SHA -and $env:PUSH_BEFORE_SHA -ne $zeroSha) {
            $baseSha = $env:PUSH_BEFORE_SHA
          } else {
            $baseSha = (& git rev-parse "$env:GITHUB_SHA^").Trim()
          }
          & git cat-file -e "$baseSha^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Diff base is unavailable: $baseSha" }
          & git diff --check "${baseSha}...$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
