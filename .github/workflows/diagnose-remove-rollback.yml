name: Diagnose retained remove rollback

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Canonical clone retained prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "C:\joeness-retained-diag-${{ github.run_id }}"
          $repo = Join-Path $root 'repo'
          $tmp = Join-Path $root 'tmp'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Path $root | Out-Null
          New-Item -ItemType Directory -Path $tmp | Out-Null
          try {
            & git clone --no-local --no-checkout -- $env:GITHUB_WORKSPACE $repo
            if ($LASTEXITCODE -ne 0) { throw 'canonical diagnostic clone failed' }
            & git -C $repo checkout --detach --force $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'canonical diagnostic checkout failed' }
            $env:TEMP = $tmp
            $env:TMP = $tmp
            Push-Location $repo
            try {
              $tests = @(
                'Test-ModeAndExitContract',
                'Test-AstraLegacyRemovalFailsClosed',
                'Test-ForgedManagedBlockFailsClosed',
                'Test-ExactControlRemovePreflightBlockers',
                'Test-ExactControlNoFinalNewlineRemoval',
                'Test-UncertainHistoricalStateFailsClosed',
                'Test-RemoveRollback'
              )
              & .\tests\sync-harness.tests.ps1 -Only $tests
            } finally {
              Pop-Location
            }
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          }
