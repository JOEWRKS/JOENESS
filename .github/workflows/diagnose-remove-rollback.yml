name: Diagnose retained remove rollback

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: WinPS retained prefix through Remove rollback
        id: winps_prefix
        continue-on-error: true
        shell: powershell
        run: |
          $tests = @(
            'Test-ModeAndExitContract',
            'Test-AstraLegacyRemovalFailsClosed',
            'Test-ForgedManagedBlockFailsClosed',
            'Test-ExactControlRemovePreflightBlockers',
            'Test-ExactControlNoFinalNewlineRemoval',
            'Test-UncertainHistoricalStateFailsClosed',
            'Test-RemoveRollback'
          )
          .\tests\sync-harness.tests.ps1 -Only $tests

      - name: pwsh retained prefix through Remove rollback
        id: pwsh_prefix
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @(
            'Test-ModeAndExitContract',
            'Test-AstraLegacyRemovalFailsClosed',
            'Test-ForgedManagedBlockFailsClosed',
            'Test-ExactControlRemovePreflightBlockers',
            'Test-ExactControlNoFinalNewlineRemoval',
            'Test-UncertainHistoricalStateFailsClosed',
            'Test-RemoveRollback'
          )
          .\tests\sync-harness.tests.ps1 -Only $tests

      - name: Report prefix diagnostic
        if: always()
        shell: pwsh
        run: |
          Write-Host "winps_prefix=${{ steps.winps_prefix.outcome }}"
          Write-Host "pwsh_prefix=${{ steps.pwsh_prefix.outcome }}"
