name: Patch Astra schema runtime compatibility

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact cross-runtime schema patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/sync-harness.ps1'
          $text = [IO.File]::ReadAllText($path)
          $old = "if (`$state.schemaVersion -isnot [int] -or `$state.schemaVersion -notin @(1, 2)) { throw 'Unsupported state schemaVersion' }"
          $new = "if ((`$state.schemaVersion -isnot [int] -and `$state.schemaVersion -isnot [long]) -or `$state.schemaVersion -notin @(1, 2)) { throw 'Unsupported state schemaVersion' }"
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -eq 0) {
            Write-Host 'Exact schema guard is already patched; no write required.'
            exit 0
          }
          if ($count -ne 1) { throw "Expected exactly one schema guard, found $count" }
          $updated = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $updated, (New-Object Text.UTF8Encoding($false)))
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after patch' }
          $diff = & git diff -- $path
          Write-Host ($diff -join "`n")
          if (-not $diff) { throw 'Expected one production diff after schema patch' }

          git config user.name 'JOEWRKS'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $path
          git commit -m 'fix: accept JSON integer schema across PowerShell runtimes'
          if ($LASTEXITCODE -ne 0) { throw 'patch commit failed' }
          git push origin HEAD:codex/joeness-v0.2-astra-judgment
          if ($LASTEXITCODE -ne 0) { throw 'patch push failed' }
