name: Diagnose retained remove rollback

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: WinPS baseline Remove rollback
        shell: powershell
        run: .\tests\sync-harness.tests.ps1 -Only Test-RemoveRollback

      - name: pwsh Remove rollback
        id: pwsh_only
        continue-on-error: true
        shell: pwsh
        run: .\tests\sync-harness.tests.ps1 -Only Test-RemoveRollback

      - name: WinPS Remove rollback with isolated TEMP
        id: winps_temp
        continue-on-error: true
        shell: powershell
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'joeness-winps-temp'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          $env:TEMP = $isolated
          $env:TMP = $isolated
          .\tests\sync-harness.tests.ps1 -Only Test-RemoveRollback

      - name: pwsh Remove rollback with isolated TEMP
        id: pwsh_temp
        continue-on-error: true
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'joeness-pwsh-temp'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          $env:TEMP = $isolated
          $env:TMP = $isolated
          .\tests\sync-harness.tests.ps1 -Only Test-RemoveRollback

      - name: Report cross-runtime diagnostic
        if: always()
        shell: pwsh
        run: |
          Write-Host "pwsh_only=${{ steps.pwsh_only.outcome }}"
          Write-Host "winps_temp=${{ steps.winps_temp.outcome }}"
          Write-Host "pwsh_temp=${{ steps.pwsh_temp.outcome }}"
