name: Materialize Astra Judgment ledger docs

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/joeness-v0.2-astra-judgment

      - name: Materialize exact documentation patches
        run: node ./scripts/materialize-astra-judgment-docs.mjs

      - name: Commit materialized docs when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- TASKS.md docs/contracts/JOEWRKS_CROSS_SYSTEM_AUTHORITY_V1.md; then
            echo "No documentation materialization change required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASKS.md docs/contracts/JOEWRKS_CROSS_SYSTEM_AUTHORITY_V1.md
          git commit -m "docs: reopen JOENESS 0.2 release ledger"
          git push origin HEAD:codex/joeness-v0.2-astra-judgment
