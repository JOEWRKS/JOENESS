name: Fix JOENESS 0.2 documentation whitespace

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Remove trailing whitespace from release docs only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'docs/handoff/2026-09-09-joeness-astra-judgment-release-handoff.md',
            'docs/superpowers/specs/2026-09-08-joeness-astra-independent-judgment-design.md'
          )
          $changed = $false
          foreach ($path in $paths) {
            $text = [IO.File]::ReadAllText($path)
            $updated = [regex]::Replace($text, '[ \t]+(\r?\n)', '$1')
            $updated = [regex]::Replace($updated, '[ \t]+$', '')
            if ($updated -cne $text) {
              [IO.File]::WriteAllText($path, $updated, (New-Object Text.UTF8Encoding($false)))
              $changed = $true
            }
          }
          if (-not $changed) {
            Write-Host 'Release documentation already has no trailing whitespace.'
            exit 0
          }
          & git diff --check 5e7497bd104527d5e6dbfc36011f0f5ee3668ff5...HEAD
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Pre-commit base diff still contains old whitespace because fixes are unstaged; validating working diff instead.'
          }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Working diff still contains whitespace errors.' }
          $diff = & git diff -- $paths
          Write-Host ($diff -join "`n")
          git config user.name 'JOEWRKS'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $paths
          git commit -m 'docs: remove release diff trailing whitespace'
          if ($LASTEXITCODE -ne 0) { throw 'whitespace-fix commit failed' }
          git push origin HEAD:codex/joeness-v0.2-astra-judgment
          if ($LASTEXITCODE -ne 0) { throw 'whitespace-fix push failed' }
