name: Materialize Astra Judgment installer patch

'on':
  push:
    branches:
      - codex/joeness-v0.2-astra-judgment

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: codex/joeness-v0.2-astra-judgment

      - name: Materialize deterministic PowerShell patch
        run: node ./scripts/materialize-astra-judgment-v02.mjs

      - name: Commit materialized source when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/sync-harness.ps1; then
            echo "No materialization change required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-harness.ps1
          git commit -m "feat: enable Astra judgment managed core"
          git push origin HEAD:codex/joeness-v0.2-astra-judgment
