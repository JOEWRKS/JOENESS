name: Diagnose cleanup installer

'on':
  push:
    branches:
      - codex/joeness-current-main-cleanup

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Show Check and Apply output
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'joeness-diagnose'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $root 'AGENTS.md'), "user prefix`r`nuser suffix", (New-Object Text.UTF8Encoding($false)))
          Write-Host '=== CHECK ==='
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\JOENESS.ps1 -Check -CodexHome $root
          Write-Host "CHECK EXIT=$LASTEXITCODE"
          Write-Host '=== APPLY ==='
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\JOENESS.ps1 -Apply -CodexHome $root
          Write-Host "APPLY EXIT=$LASTEXITCODE"
          Write-Host '=== FILES ==='
          Get-ChildItem -LiteralPath $root -Force | ForEach-Object { Write-Host $_.FullName }
          exit 0
