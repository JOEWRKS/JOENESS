  file_sha256: e0259b0521636097a545aee968b1b9db04abadc77b5d4bcee76391ee705cfd9c

outputs:
  control:
    commit: unknown
    file_sha256: unknown
    evidence_sha256: unknown
    status: unknown
  core:
    commit: unknown
    file_sha256: unknown
    evidence_sha256: unknown
    status: unknown

